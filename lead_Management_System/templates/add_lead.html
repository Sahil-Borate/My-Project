<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Add Lead</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">
Add New Lead
</h2>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Mobile</label>

<input
type="text"
name="mobile"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control">

</div>

<div class="mb-3">

<label>Course</label>

<input
type="text"
name="course"
class="form-control">

</div>

<div class="mb-3">

<label>City</label>

<input
type="text"
name="city"
class="form-control">

</div>

<div class="mb-3">

<label>Lead Source</label>

<select
name="source"
class="form-select">

<option>Walk In</option>
<option>Phone Call</option>
<option>Website</option>
<option>Facebook</option>
<option>Instagram</option>
<option>Meta Ads</option>

</select>

</div>

<input
type="submit"
class="btn btn-success"
value="Save Lead">

<a
href="/"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>

</html>
