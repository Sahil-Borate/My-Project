<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="text-center text-primary">

Counsellor Dashboard

</h2>

<div class="row mt-4">

<div class="col-md-4">

<div class="card bg-primary text-white">

<div class="card-body">

<h5>Total Leads</h5>

<h2>{{total_leads}}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-success text-white">

<div class="card-body">

<h5>Today's Follow-ups</h5>

<h2>{{today_followups}}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-danger text-white">

<div class="card-body">

<h5>Missed Follow-ups</h5>

<h2>{{missed_followups}}</h2>

</div>

</div>

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<div class="card bg-warning">

<div class="card-body">

<h5>Admissions</h5>

<h2>{{admissions}}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-info">

<div class="card-body">

<h5>Pending Leads</h5>

<h2>{{pending_leads}}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-secondary text-white">

<div class="card-body">

<h5>Total Calls</h5>

<h2>{{total_calls}}</h2>

</div>

</div>

</div>

</div>

<br>

<a href="/" class="btn btn-dark">

Home

</a>

</div>

</body>

</html>
